<!DOCTYPE html>
<html lang="th" data-theme="dark" data-animation="on" data-blur="on" data-showcover="on">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0F172A" />
<title>Music Player</title>
<link rel="icon" href="assets/images/default-cover.svg" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div id="app-shell">

  <!-- Routed page content is injected here by js/app.js -->
  <main id="page-container" aria-live="polite"></main>

  <!-- ============ Mini Player ============ -->
  <div id="mini-player" class="is-hidden" role="button" aria-label="Now playing">
    <div id="mini-progress" class="mini-progress"></div>
    <div id="mini-cover" class="mini-cover"></div>
    <div class="mini-meta">
      <div id="mini-title" class="mini-title">—</div>
      <div id="mini-artist" class="mini-artist">—</div>
    </div>
    <div class="mini-controls">
      <button id="mini-play-btn" class="icon-btn" data-i18n-aria="btn_play" aria-label="Play"></button>
      <button id="mini-next-btn" class="icon-btn" data-i18n-aria="btn_next" aria-label="Next"></button>
    </div>
  </div>

  <!-- ============ Bottom Navigation ============ -->
  <nav id="bottom-nav">
    <button class="nav-btn is-active" data-route="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span data-i18n="nav_library">Library</span>
    </button>
    <button class="nav-btn" data-route="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span data-i18n="nav_search">Search</span>
    </button>
    <button class="nav-btn" data-route="playlist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h11M4 12h11M4 18h6M17 9v9a2.5 2.5 0 11-2-2.45V9h2z"/></svg>
      <span data-i18n="nav_playlist">Playlists</span>
    </button>
    <button class="nav-btn" data-route="favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.2-4.6-9.7-9C.6 9 1.7 5.7 4.7 4.7c1.9-.6 3.9 0 5.3 1.6 1.4-1.6 3.4-2.2 5.3-1.6 3 1 4.1 4.3 2.4 7.3-2.5 4.4-9.7 9-9.7 9z"/></svg>
      <span data-i18n="nav_favorites">Favorites</span>
    </button>
    <button class="nav-btn" data-route="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.6V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.6 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.6 1z"/></svg>
      <span data-i18n="nav_settings">Settings</span>
    </button>
  </nav>

  <!-- ============ Full Player (bottom sheet, full screen) ============ -->
  <div id="full-player" class="full-player">
    <div class="fp-topbar">
      <button id="fp-collapse-btn" class="icon-btn" aria-label="Collapse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="fp-label">
        <div class="fp-label-eyebrow" data-i18n="nav_playlist">Playing from</div>
        <div class="fp-label-name" data-i18n="app_name">Playlist+</div>
      </div>
      <button id="fp-queue-btn" class="icon-btn" data-i18n-aria="btn_queue" aria-label="Queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h10M18 15v6m3-3h-6"/></svg>
      </button>
    </div>

    <div class="fp-cover-wrap">
      <div id="fp-cover" class="cover-art"></div>
    </div>

    <div class="fp-info">
      <div id="fp-title" class="fp-title">—</div>
      <div id="fp-artist" class="fp-artist">—</div>
    </div>

    <div class="fp-progress">
      <div id="fp-progress-track" class="progress-track">
        <div id="fp-progress-fill" class="progress-fill"></div>
        <div id="fp-progress-thumb" class="progress-thumb"></div>
      </div>
      <div class="progress-time">
        <span id="fp-current-time">0:00</span>
        <span id="fp-duration">0:00</span>
      </div>
    </div>

    <div class="fp-controls">
      <button id="fp-shuffle-btn" class="transport-btn toggle-btn" data-i18n-aria="btn_shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 3l4 4-4 4v-3h-3.6l-2-2H17V3zM3 6h4.4l7.6 9.5L17 18h4l-4-4v3h-3.5L6 8.5H3V6zM17 18v3l4-4-4-4v3h-2.5l-1.2-1.5-1.3 1.6L14 18h3z"/></svg>
      </button>
      <button id="fp-prev-btn" class="transport-btn" data-i18n-aria="btn_previous" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 5L8 12l10 7V5zM6 5h2v14H6z"/></svg>
      </button>
      <button id="fp-play-btn" class="play-btn-lg" data-i18n-aria="btn_play" aria-label="Play"></button>
      <button id="fp-next-btn" class="transport-btn" data-i18n-aria="btn_next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l10 7-10 7V5zM18 5h2v14h-2z"/></svg>
      </button>
      <button id="fp-repeat-btn" class="transport-btn toggle-btn" data-i18n-aria="btn_repeat" aria-label="Repeat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <div class="fp-bottom-actions">
      <button id="fp-favorite-btn" data-i18n-aria="btn_favorite" aria-label="Favorite"></button>
    </div>
  </div>

  <!-- ============ Queue sheet ============ -->
  <div id="queue-sheet" class="sheet-overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" data-i18n="queue_title">Up next</div>
      <div id="queue-list"></div>
      <button id="queue-close" class="btn btn-ghost btn-block" style="margin-top:16px" data-i18n="btn_close">Close</button>
    </div>
  </div>

  <!-- ============ Song menu sheet ============ -->
  <div id="song-menu-sheet" class="sheet-overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div id="song-menu-title" class="sheet-title">—</div>
      <div class="song-list">
        <button id="song-menu-add-playlist" class="song-item" style="width:100%;text-align:left">
          <div class="song-cover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h11M4 12h11M4 18h6M17 9v9a2.5 2.5 0 11-2-2.45V9h2z"/></svg></div>
          <div class="song-meta"><div class="song-title" data-i18n="btn_add_to_playlist">Add to playlist</div></div>
        </button>
        <button id="song-menu-edit" class="song-item" style="width:100%;text-align:left">
          <div class="song-cover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></div>
          <div class="song-meta"><div class="song-title" data-i18n="btn_edit">Edit</div></div>
        </button>
        <button id="song-menu-delete" class="song-item" style="width:100%;text-align:left">
          <div class="song-cover" style="color:var(--color-danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m-8 0l1 13h8l1-13"/></svg></div>
          <div class="song-meta"><div class="song-title" style="color:var(--color-danger)" data-i18n="btn_delete">Delete</div></div>
        </button>
      </div>
      <button id="song-menu-close" class="btn btn-ghost btn-block" style="margin-top:16px" data-i18n="btn_cancel">Cancel</button>
    </div>
  </div>

  <!-- ============ Add-to-playlist sheet ============ -->
  <div id="add-to-playlist-sheet" class="sheet-overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" data-i18n="btn_add_to_playlist">Add to playlist</div>
      <div id="add-to-playlist-list" class="song-list"></div>
      <button id="add-to-playlist-new" class="btn btn-primary btn-block" style="margin-top:16px" data-i18n="playlist_create_title">Create new playlist</button>
      <button id="add-to-playlist-close" class="btn btn-ghost btn-block" style="margin-top:8px" data-i18n="btn_close">Close</button>
    </div>
  </div>

  <!-- ============ Edit song modal ============ -->
  <div id="edit-song-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" data-i18n="btn_edit">Edit</div>
      <div class="field">
        <label data-i18n="title_library">Title</label>
        <input id="edit-title-input" type="text" />
      </div>
      <div class="field">
        <label data-i18n="unknown_artist">Artist</label>
        <input id="edit-artist-input" type="text" />
      </div>
      <div class="field">
        <label data-i18n="unknown_album">Album</label>
        <input id="edit-album-input" type="text" />
      </div>
      <div class="modal-actions">
        <button id="edit-song-cancel" class="btn btn-ghost" data-i18n="btn_cancel">Cancel</button>
        <button id="edit-song-save" class="btn btn-primary" data-i18n="btn_save">Save</button>
      </div>
    </div>
  </div>

</div>

<!-- ============ Toast host ============ -->
<div id="toast-host"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
