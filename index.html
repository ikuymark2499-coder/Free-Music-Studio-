        </button>
      </div>
      <button id="song-menu-close" class="btn btn-ghost btn-block" style="margin-top:16px" data-i18n="btn_cancel">Cancel</button>
    </div>
  </div>

  <!-- ============ Add-to-playlist sheet ============ -->
  <div id="add-to-playlist-sheet" class="sheet-overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" data-i18n="btn_add_to_playlist">Add to playlist</div>
      <div id="add-to-playlist-list" class="song-list"></div>
      <button id="add-to-playlist-new" class="btn btn-primary btn-block" style="margin-top:16px" data-i18n="playlist_create_title">Create new playlist</button>
      <button id="add-to-playlist-close" class="btn btn-ghost btn-block" style="margin-top:8px" data-i18n="btn_close">Close</button>
    </div>
  </div>

  <!-- ============ Edit song modal ============ -->
  <div id="edit-song-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" data-i18n="btn_edit">Edit</div>
      <div class="field">
        <label data-i18n="title_library">Title</label>
        <input id="edit-title-input" type="text" />
      </div>
      <div class="field">
        <label data-i18n="unknown_artist">Artist</label>
        <input id="edit-artist-input" type="text" />
      </div>
      <div class="field">
        <label data-i18n="unknown_album">Album</label>
        <input id="edit-album-input" type="text" />
      </div>
      <div class="modal-actions">
        <button id="edit-song-cancel" class="btn btn-ghost" data-i18n="btn_cancel">Cancel</button>
        <button id="edit-song-save" class="btn btn-primary" data-i18n="btn_save">Save</button>
      </div>
    </div>
  </div>

</div>

<!-- ============ Toast host ============ -->
<div id="toast-host"></div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then(reg => {
        console.log("Service Worker registered:", reg.scope);
      })
      .catch(err => {
        console.error("Service Worker failed:", err);
      });
  });
}
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
